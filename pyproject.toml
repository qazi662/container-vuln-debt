[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-vuln-debt"
version = "0.1.0"
description = "Weekly measurement of known vulnerability debt in popular container images"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Taimur Qazi"}]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cvd = "cvd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PLW1510"]

[tool.ruff.lint.isort]
known-first-party = ["cvd", "common"]
